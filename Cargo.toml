[package]
name = "hello_cargo"
version = "0.1.79"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.39"
rand = "0.8.5"
tokio = { version = "1.43.0", features = ["macros",  "io-util","rt","time", "rt-multi-thread", "process", "sync"] }
tokio-macros = "2.5.0"
utf8_slice = "1.0.0"
warp = { version = "0.3.7", features = ["default"] }
winapi = { version = "0.3.9", features = ["winuser", "windef", "ntdef","winbase", "minwindef"] }
reqwest = { version = "0.12.12", features = ["json","multipart","stream"] }
serde_json = { version = "1.0.139", features = ["default"] }
serde = { version = "1.0.218", features = ["derive"] }
futures = "0.3.31"
user32-sys = "0.2.0"
rsautogui = "0.2.2"
screenshots = "0.8.10"
hyper = { version = "1.6.0", features = ["full"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.1"
axum = "0.8.3"
tower-http = { version =  "0.6.2",   features = ["fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
enigo = "0.3.0"
runas = "1.2.0"
is_elevated = "0.1.2"
rodio = "0.21.1"
edge-tts-rust = "0.1.3"
arboard = "3.5.0"
rust_socketio = { version = "0.6.0", features = ["async"] }
